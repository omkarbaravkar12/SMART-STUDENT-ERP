<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Timetable — Smart ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/variables.css"/>
<link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
<div id="toast-container"></div>
<div class="app-shell" id="appShell">
<aside class="sidebar" id="sidebar"></aside>
<header class="top-header">
  <div class="header-left">
    <button class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg></button>
    <div><div class="page-title">My Timetable</div><div class="breadcrumb">Teacher Portal · Schedule</div></div>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
  </div>
</header>
<main class="main-content">
  <div class="content-inner">
    <div class="page-header">
      <div><h1>My Teaching Schedule</h1><p>Your weekly class timetable</p></div>
    </div>

    <!-- Today -->
    <div style="background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.1));border:1px solid rgba(99,102,241,0.3);border-radius:14px;padding:20px;margin-bottom:24px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:1rem;margin-bottom:12px">📅 Today — <span id="todayLabel"></span></div>
      <div id="todaySlots" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>

    <!-- Full Week -->
    <div class="card">
      <div class="card-title" style="margin-bottom:20px">Full Weekly Schedule</div>
      <div id="weekGrid" style="overflow-x:auto"></div>
    </div>
  </div>
</main>
</div>

<style>
.day-header{font-family:var(--font-display);font-weight:700;font-size:0.85rem;color:var(--brand-primary);padding:10px;text-align:center;background:var(--bg-elevated);border-radius:8px;margin-bottom:8px;}
.day-header.today-col{background:rgba(99,102,241,0.2);}
.tt-slot-card{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;margin-bottom:8px;transition:all 0.2s ease;}
.tt-slot-card:hover{border-color:rgba(99,102,241,0.4);transform:translateY(-1px);}
.tt-time-badge{font-size:0.72rem;font-weight:600;color:var(--brand-primary);background:rgba(99,102,241,0.1);padding:2px 8px;border-radius:4px;margin-bottom:6px;display:inline-block;}
.today-slot{background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.3);border-radius:10px;padding:12px 16px;min-width:180px;}
</style>

<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
<script>
document.getElementById('sidebar').innerHTML = `
<div class="sidebar-brand"><div class="brand-icon" style="width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🎓</div><span class="brand-name">Smart ERP</span></div>
<nav class="sidebar-nav">
<a class="nav-item" href="teacher-dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
<a class="nav-item" href="teacher-attendance.html"><span class="nav-icon">📅</span><span class="nav-label">Mark Attendance</span></a>
<a class="nav-item" href="teacher-marks.html"><span class="nav-icon">📝</span><span class="nav-label">Upload Marks</span></a>
<a class="nav-item active" href="teacher-timetable.html"><span class="nav-icon">🗓️</span><span class="nav-label">My Timetable</span></a>
<a class="nav-item" href="teacher-students.html"><span class="nav-icon">🎓</span><span class="nav-label">My Students</span></a>
<a class="nav-item" href="notifications.html"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span></a>
</nav>
<div class="sidebar-footer"><div class="user-card"><div class="user-avatar" id="userAvatarSidebar">T</div><div class="user-info"><div class="user-name" id="userNameSidebar">Teacher</div><div class="user-role" id="userRoleSidebar">teacher</div></div></div></div>`;

const DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('todayLabel').textContent = TODAY;
  const res   = await TimetableAPI.list({});
  const slots = res?.data?.data || [];

  const byDay = {};
  DAYS.forEach(d => byDay[d] = []);
  slots.forEach(s => { if (byDay[s.day_of_week]) byDay[s.day_of_week].push(s); });

  // Today
  const todayEl    = document.getElementById('todaySlots');
  const todaySlots = byDay[TODAY] || [];
  if (!todaySlots.length) {
    todayEl.innerHTML = '<p style="color:var(--text-secondary);font-size:0.85rem">No classes today 🎉</p>';
  } else {
    todayEl.innerHTML = todaySlots.map(s => `
      <div class="today-slot">
        <div class="tt-time-badge">${String(s.start_time).substring(0,5)} - ${String(s.end_time).substring(0,5)}</div>
        <div style="font-weight:600;font-size:0.87rem">${s.subject_name}</div>
        <div style="font-size:0.72rem;color:var(--text-secondary)">${s.course_name}</div>
        <div style="font-size:0.72rem;color:var(--brand-primary);margin-top:3px">📍 ${s.room || 'TBD'}</div>
      </div>
    `).join('');
  }

  // Full week
  const activeDays = DAYS.filter(d => byDay[d].length > 0);
  if (!activeDays.length) {
    document.getElementById('weekGrid').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px">No timetable assigned yet</p>';
    return;
  }
  document.getElementById('weekGrid').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(${activeDays.length},1fr);gap:12px;min-width:${activeDays.length*170}px">
      ${activeDays.map(day => `
        <div>
          <div class="day-header ${day===TODAY?'today-col':''}">${day}${day===TODAY?' ⭐':''}</div>
          ${byDay[day].map(s => `
            <div class="tt-slot-card">
              <div class="tt-time-badge">${String(s.start_time).substring(0,5)} - ${String(s.end_time).substring(0,5)}</div>
              <div style="font-weight:600;font-size:0.85rem;margin-bottom:3px">${s.subject_name}</div>
              <div style="font-size:0.72rem;color:var(--text-secondary)">${s.course_name}</div>
              <div style="font-size:0.72rem;color:var(--brand-primary);margin-top:4px">📍 Room ${s.room || 'TBD'}</div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>`;
});
</script>
</body>
</html>
