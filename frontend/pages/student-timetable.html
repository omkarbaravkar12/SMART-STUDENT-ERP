<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Timetable — Smart ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/variables.css"/>
<link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
<div id="toast-container"></div>
<div class="app-shell" id="appShell">
<aside class="sidebar" id="sidebar"></aside>
<header class="top-header">
  <div class="header-left">
    <button class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg></button>
    <div><div class="page-title">My Timetable</div><div class="breadcrumb">Student Portal · Class Schedule</div></div>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
  </div>
</header>
<main class="main-content">
  <div class="content-inner">
    <div class="page-header">
      <div><h1>My Timetable</h1><p id="semesterInfo">Loading your class schedule...</p></div>
    </div>

    <!-- Today highlight -->
    <div id="todayCard" style="background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.1));border:1px solid rgba(99,102,241,0.3);border-radius:14px;padding:20px;margin-bottom:24px">
      <div style="font-family:var(--font-display);font-weight:700;font-size:1rem;margin-bottom:12px">📅 Today's Classes — <span id="todayLabel"></span></div>
      <div id="todaySlots" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>

    <!-- Full week timetable -->
    <div class="card">
      <div class="card-title" style="margin-bottom:20px">Weekly Schedule</div>
      <div id="weekGrid" style="overflow-x:auto"></div>
    </div>
  </div>
</main>
</div>

<style>
.day-col { min-width: 160px; }
.day-header { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--brand-primary); padding: 10px; text-align: center; background: var(--bg-elevated); border-radius: 8px; margin-bottom: 8px; }
.day-header.today-col { background: rgba(99,102,241,0.2); color: var(--brand-primary); }
.tt-slot-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; margin-bottom: 8px; transition: all 0.2s ease; }
.tt-slot-card:hover { border-color: rgba(99,102,241,0.4); transform: translateY(-1px); }
.tt-time-badge { font-size: 0.72rem; font-weight: 600; color: var(--brand-primary); background: rgba(99,102,241,0.1); padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; display: inline-block; }
.tt-subject { font-weight: 600; font-size: 0.87rem; margin-bottom: 3px; }
.tt-teacher { font-size: 0.75rem; color: var(--text-secondary); }
.tt-room    { font-size: 0.72rem; color: var(--brand-primary); margin-top: 3px; }
.today-slot { background: linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.1)); border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; padding: 12px 16px; min-width: 180px; }
</style>

<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
<script>
document.getElementById('sidebar').innerHTML = `
<div class="sidebar-brand"><div class="brand-icon" style="width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🎓</div><span class="brand-name">Smart ERP</span></div>
<nav class="sidebar-nav">
<a class="nav-item" href="student-dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
<a class="nav-item" href="student-attendance.html"><span class="nav-icon">📅</span><span class="nav-label">My Attendance</span></a>
<a class="nav-item active" href="student-timetable.html"><span class="nav-icon">🗓️</span><span class="nav-label">Timetable</span></a>
<a class="nav-item" href="student-results.html"><span class="nav-icon">📝</span><span class="nav-label">Exam Results</span></a>
<a class="nav-item" href="student-fees.html"><span class="nav-icon">💳</span><span class="nav-label">My Fees</span></a>
<a class="nav-item" href="student-library.html"><span class="nav-icon">📚</span><span class="nav-label">Library</span></a>
</nav>
<div class="sidebar-footer"><div class="user-card"><div class="user-avatar" id="userAvatarSidebar">S</div><div class="user-info"><div class="user-name" id="userNameSidebar">Student</div><div class="user-role" id="userRoleSidebar">student</div></div></div></div>`;

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('todayLabel').textContent = TODAY;

  const studRes = await StudentsAPI.list({ limit: 1 });
  const student = studRes?.data?.data?.[0];
  if (!student) { Toast.error('Could not load profile'); return; }

  document.getElementById('semesterInfo').textContent = `${student.courseName || 'Course'} · Semester ${student.currentSemester}`;

  const res = await StudentsAPI.timetable(student.id);
  const tt  = res?.data?.data?.timetable || {};

  // Today's classes
  const todaySlots = tt[TODAY] || [];
  const todayEl    = document.getElementById('todaySlots');
  if (!todaySlots.length) {
    todayEl.innerHTML = '<p style="color:var(--text-secondary);font-size:0.85rem">No classes today 🎉</p>';
  } else {
    todayEl.innerHTML = todaySlots.map(s => `
      <div class="today-slot">
        <div class="tt-time-badge">${s.startTime?.substring(0,5)} - ${s.endTime?.substring(0,5)}</div>
        <div class="tt-subject">${s.subjectName}</div>
        <div class="tt-teacher">👨‍🏫 ${s.teacherName || 'TBD'}</div>
        <div class="tt-room">📍 Room ${s.room || 'TBD'}</div>
      </div>
    `).join('');
  }

  // Full week grid
  const weekGrid = document.getElementById('weekGrid');
  const activeDays = DAYS.filter(d => tt[d] && tt[d].length > 0);

  if (!activeDays.length) {
    weekGrid.innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:40px">No timetable data available for this semester</p>';
    return;
  }

  weekGrid.innerHTML = `<div style="display:grid;grid-template-columns:repeat(${activeDays.length},1fr);gap:12px;min-width:${activeDays.length * 170}px">
    ${activeDays.map(day => `
      <div class="day-col">
        <div class="day-header ${day === TODAY ? 'today-col' : ''}">${day}${day === TODAY ? ' ⭐' : ''}</div>
        ${(tt[day] || []).map(s => `
          <div class="tt-slot-card">
            <div class="tt-time-badge">${s.startTime?.substring(0,5)} - ${s.endTime?.substring(0,5)}</div>
            <div class="tt-subject">${s.subjectName}</div>
            <div class="tt-teacher">👨‍🏫 ${s.teacherName || 'TBD'}</div>
            <div class="tt-room">📍 ${s.room || 'TBD'}</div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  </div>`;
});
</script>
</body>
</html>
