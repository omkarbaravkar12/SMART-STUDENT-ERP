<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timetable — Smart ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/variables.css"/>
<link rel="stylesheet" href="../css/dashboard.css"/>
</head>
<body>
<div id="toast-container"></div>
<div class="app-shell" id="appShell">
<aside class="sidebar" id="sidebar"></aside>
<header class="top-header">
  <div class="header-left">
    <button class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg></button>
    <div><div class="page-title">Timetable</div><div class="breadcrumb">Academic · Class Schedule</div></div>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
  </div>
</header>
<main class="main-content">
  <div class="content-inner">
    <div class="page-header">
      <div><h1>Timetable Management</h1><p>View and manage class schedules</p></div>
    </div>

    <!-- Filters -->
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <select class="form-select" id="courseFilter" onchange="loadTimetable()" style="width:220px">
        <option value="">All Courses</option>
      </select>
      <select class="form-select" id="semFilter" onchange="loadTimetable()" style="width:160px">
        <option value="">All Semesters</option>
        <option value="1">Semester 1</option><option value="2">Semester 2</option>
        <option value="3">Semester 3</option><option value="4">Semester 4</option>
        <option value="5">Semester 5</option><option value="6">Semester 6</option>
        <option value="7">Semester 7</option><option value="8">Semester 8</option>
      </select>
    </div>

    <!-- Timetable Grid -->
    <div id="timetableContainer">
      <div class="skeleton" style="height:400px;border-radius:16px"></div>
    </div>
  </div>
</main>
</div>

<style>
.tt-grid { display: grid; grid-template-columns: 100px repeat(6, 1fr); gap: 8px; }
.tt-header { background: var(--bg-elevated); padding: 12px 8px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 0.82rem; font-family: var(--font-display); color: var(--brand-primary); }
.tt-time { background: var(--bg-elevated); padding: 10px 8px; border-radius: 8px; text-align: center; font-size: 0.75rem; color: var(--text-tertiary); font-weight: 600; }
.tt-slot {
  background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
  border-radius: 8px; padding: 10px;
  font-size: 0.78rem; min-height: 60px;
  transition: all 0.2s ease;
}
.tt-slot:hover { background: rgba(99,102,241,0.15); transform: translateY(-1px); }
.tt-slot .subject { font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.tt-slot .teacher { color: var(--text-secondary); font-size: 0.72rem; }
.tt-slot .room    { color: var(--brand-primary); font-size: 0.72rem; font-weight: 600; }
.tt-empty { min-height: 60px; border-radius: 8px; background: var(--bg-elevated); opacity: 0.3; }
</style>

<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
<script>
document.getElementById('sidebar').innerHTML = `
<div class="sidebar-brand"><div class="brand-icon" style="width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🎓</div><span class="brand-name">Smart ERP</span></div>
<nav class="sidebar-nav">
<a class="nav-item" href="admin-dashboard.html"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
<a class="nav-item" href="students.html"><span class="nav-icon">🎓</span><span class="nav-label">Students</span></a>
<a class="nav-item" href="teachers.html"><span class="nav-icon">👩‍🏫</span><span class="nav-label">Teachers</span></a>
<a class="nav-item" href="attendance.html"><span class="nav-icon">📅</span><span class="nav-label">Attendance</span></a>
<a class="nav-item active" href="timetable.html"><span class="nav-icon">🗓️</span><span class="nav-label">Timetable</span></a>
<a class="nav-item" href="exams.html"><span class="nav-icon">📝</span><span class="nav-label">Examinations</span></a>
<a class="nav-item" href="fees.html"><span class="nav-icon">💳</span><span class="nav-label">Fee Management</span></a>
<a class="nav-item" href="library.html"><span class="nav-icon">📚</span><span class="nav-label">Library</span></a>
<a class="nav-item" href="notifications.html"><span class="nav-icon">🔔</span><span class="nav-label">Notifications</span></a>
</nav>
<div class="sidebar-footer"><div class="user-card"><div class="user-avatar" id="userAvatarSidebar">A</div><div class="user-info"><div class="user-name" id="userNameSidebar">Admin</div><div class="user-role" id="userRoleSidebar">admin</div></div></div></div>`;

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

document.addEventListener('DOMContentLoaded', async () => {
  const res = await CoursesAPI.list();
  if (res?.ok) {
    (res.data?.data || []).forEach(c => {
      document.getElementById('courseFilter').innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
  }
  loadTimetable();
});

async function loadTimetable() {
  const courseId = document.getElementById('courseFilter').value;
  const semester = document.getElementById('semFilter').value;
  const container = document.getElementById('timetableContainer');
  container.innerHTML = '<div class="skeleton" style="height:400px;border-radius:16px"></div>';

  const res = await TimetableAPI.list({ courseId, semester });
  if (!res?.ok) { container.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:40px">Failed to load timetable</p>'; return; }
  const slots = res.data?.data || [];

  if (!slots.length) {
    container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)"><div style="font-size:3rem">📅</div><div style="margin-top:12px">No timetable data found.<br>Please select a course and semester.</div></div>';
    return;
  }

  // Group by day and time
  const byDay = {};
  DAYS.forEach(d => byDay[d] = {});
  slots.forEach(s => {
    if (!byDay[s.day_of_week]) byDay[s.day_of_week] = {};
    byDay[s.day_of_week][s.start_time] = s;
  });

  // Get unique times
  const times = [...new Set(slots.map(s => s.start_time))].sort();

  let html = '<div style="overflow-x:auto"><div class="tt-grid" style="min-width:700px">';
  html += '<div class="tt-header">Time</div>';
  DAYS.forEach(d => html += `<div class="tt-header">${d}</div>`);

  times.forEach(time => {
    html += `<div class="tt-time">${time?.substring(0,5) || time}</div>`;
    DAYS.forEach(day => {
      const slot = byDay[day]?.[time];
      if (slot) {
        html += `<div class="tt-slot">
          <div class="subject">${slot.subject_name || slot.subjectName}</div>
          <div class="teacher">👨‍🏫 ${slot.teacher_name || slot.teacherName || 'TBD'}</div>
          <div class="room">📍 ${slot.room || 'TBD'}</div>
        </div>`;
      } else {
        html += '<div class="tt-empty"></div>';
      }
    });
  });

  html += '</div></div>';
  container.innerHTML = html;
}
</script>
</body>
</html>
